<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;height:100dvh;background:#f4f6f9;color:#1e293b;overflow:hidden}

.tb.ac{background:#2563eb;color:#fff;font-weight:500}
.vw{flex:1;display:flex;flex-direction:column;background:#525659;width:100%;overflow:hidden}

.lc{display:flex;align-items:center;gap:8px;overflow:hidden}
.mb{display:none;background:#2563eb;color:#fff;border:none;padding:7px 11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tt{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl{text-decoration:none;background:#f1f5f9;color:#1e293b;padding:7px 10px;border-radius:8px;font-size:13px;border:1px solid #e2e8f0;white-space:nowrap;flex-shrink:0}
.pb{display:none;background:#323639;color:#f1f3f4;padding:6px 12px;align-items:center;justify-content:center;gap:14px;font-size:13px}
.pb button{background:none;border:none;color:#f1f3f4;font-size:18px;width:28px;height:28px;border-radius:50%;cursor:pointer}
iframe{flex:1;width:100%;border:none;background:#525659}
.cc{flex:1;width:100%;overflow:auto;padding:10px;display:none;flex-direction:column;align-items:center;gap:10px;-webkit-overflow-scrolling:touch}
.cc canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.ms{color:#fff;font-size:15px;padding:24px;text-align:center}
.ph{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#e2e8f0;color:#64748b;text-align:center;padding:24px}
.st{display:none;margin-top:14px;background:#2563eb;color:#fff;border:none;padding:11px 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.ov{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:90}
@media(max-width:768px){.sb{position:fixed;top:0;left:0;bottom:0;width:85%;max-width:330px;transform:translateX(-100%)}.sb.op{transform:translateX(0)}.ov.op{display:block}.cb{display:block}.mb,.st{display:inline-block}}
</style>
</head>
<body>

</div>
